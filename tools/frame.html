<!doctype html>
<html lang="en" data-ds="nightglass">
<head>
<meta charset="utf-8">
<title>Theme frame</title>
<link rel="stylesheet" href="../newtab/vendor/css/base.css">
<link rel="stylesheet" href="../newtab/vendor/css/nightglass.css">
<link rel="stylesheet" href="../newtab/onedark.css">
<style>
  html, body { margin: 0; overflow: hidden; background: #1e2127; }
  .view { position: relative; overflow: hidden; }
  .scene { position: absolute; top: 0; left: 0; }
  .scene canvas { display: block; width: 100%; height: 100%; }
  .shade { position: absolute; inset: 0; background: rgba(30, 33, 39, var(--shade)); }
  #deco { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="view" id="view"><div class="scene" id="scene"><canvas id="c"></canvas></div><div class="shade"></div><canvas id="deco"></canvas></div>
<script type="module">
  // Stars and a small compass for the tab strip. The image is left-aligned and tiled, so the compass sits at a
  // fixed x most windows show (px), level with the tabs (py). Chrome draws the frame image about 16px above
  // the tab strip, so `top` is where decoration starts.
  import sky from '../newtab/vendor/backdrops/sky.js';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? +q.get(k) : d);
  const w = num('w', 3840), h = num('h', 160), sh = num('sh', 220);
  document.getElementById('view').style.cssText = `width:${w}px;height:${h}px;--shade:${num('shade', 0.35)}`;
  document.getElementById('scene').style.cssText = `width:${w}px;height:${sh}px`;
  const px = num('px', 1180);
  sky(document.getElementById('c'), {
    chart: false, aurora: false, clouds: false, meteors: false, mountains: false, koi: false, transparent: true,
    pole: [px / w, num('py', 40) / sh],
  });

  // An hour tape along the top edge (24h per tile, like a right-ascension scale), registration crosses
  // between the hours, and a text-free compass. Every spacing divides w, so tiles meet cleanly.
  const deco = document.getElementById('deco');
  const dpr = devicePixelRatio;
  deco.width = w * dpr;
  deco.height = h * dpr;
  const ctx = deco.getContext('2d');
  ctx.scale(dpr, dpr);
  const ink = (a) => `rgba(171, 178, 191, ${a})`;
  const hour = w / 24;
  const top = num('top', 16);
  const py = num('py', 40);
  const R = 30;
  try { await document.fonts.load('500 8px "IBM Plex Mono"'); } catch {}

  ctx.fillStyle = ink(0.08);
  ctx.fillRect(0, top, w, 1);
  for (let x = 0; x < w; x += hour / 8) {
    const i = Math.round(x / (hour / 8));
    const [len, a] = i % 8 === 0 ? [7, 0.3] : i % 4 === 0 ? [4, 0.2] : [2, 0.13];
    ctx.fillStyle = ink(a);
    ctx.fillRect(Math.round(x), top, 1, len);
  }
  ctx.font = '500 8px "IBM Plex Mono", ui-monospace, monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = ink(0.24);
  for (let k = 0; k < 24; k++) {
    const x = Math.round(k * hour) + 4;
    if (x + 18 < px - R - 8 || x > px + R + 8) ctx.fillText(`${String(k).padStart(2, '0')}h`, x, top + 3);
  }

  const cross = (x, y, r, a) => {
    ctx.fillStyle = ink(a);
    ctx.fillRect(x - r, y, r * 2 + 1, 1);
    ctx.fillRect(x, y - r, 1, r * 2 + 1);
  };
  for (let k = 0; k < 24; k += 2) {
    const x = Math.round((k + 0.5) * hour);
    if (Math.abs(x - px) > 120) cross(x, top + 30, 3, 0.22);
  }

  // compass: ticked outer ring, two inner rings, crosshair, and a four-point star for Polaris
  const ring = (r, a, dash = []) => {
    ctx.strokeStyle = ink(a);
    ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.arc(px + 0.5, py + 0.5, r, 0, Math.PI * 2);
    ctx.stroke();
  };
  ctx.lineWidth = 1;
  ring(R, 0.2);
  ring(R * 0.62, 0.12, [2, 3]);
  ring(R * 0.24, 0.16);
  ctx.setLineDash([]);
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2;
    const len = i % 18 === 0 ? 7 : i % 6 === 0 ? 4 : 2;
    ctx.strokeStyle = ink(i % 18 === 0 ? 0.34 : 0.18);
    ctx.beginPath();
    ctx.moveTo(px + 0.5 + Math.cos(a) * (R + 2), py + 0.5 + Math.sin(a) * (R + 2));
    ctx.lineTo(px + 0.5 + Math.cos(a) * (R + 2 + len), py + 0.5 + Math.sin(a) * (R + 2 + len));
    ctx.stroke();
  }
  ctx.fillStyle = ink(0.16);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    for (let d = R * 0.32; d < R * 0.92; d += 4) ctx.fillRect(px + dx * d, py + dy * d, 1, 1);
  }
  ctx.fillStyle = ink(0.75);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? 4.5 : 1.2;
    ctx.lineTo(px + 0.5 + Math.cos(a) * r, py + 0.5 + Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
</script>
</body>
</html>
